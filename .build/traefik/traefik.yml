api:
  insecure: true
  dashboard: true

providers:
  file:
    filename: /etc/traefik/http.yml
    watch: true

entryPoints:
  web:
    address: ':80'
  postgres:
    address: ':5432'
  synapse:
    address: ':8008'
  synapse-admin:
    address: ':8088'
  matrix-adapter:
    address: ':8280'
  kratos-admin-ui:
    address: ':8188'
  # Swarmail (the mail sink): its UI and REST API, the MailSlurper-compatible
  # API, and SMTP, on MailSlurper's former host ports.
  swarmail-http:
    address: ':4436'
  mailslurper-api:
    address: ':4437'
  swarmail-smtp:
    address: ':1025'
  rabbitmq-amqp:
    address: ':5672'
  rabbitmq-management:
    address: ':15672'
  redis:
    address: ':6379'
  auth-evaluation:
    address: ':6060'
  hydra-public:
    address: ':4444'
  hydra-admin:
    address: ':4445'

accessLog:
  filePath: '/etc/traefik/access.log'
